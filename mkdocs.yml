site_name: World Battery Hub — Data
site_url: https://data.worldbatteryhub.com/
site_description: >-
  Machine-readable battery data — lead-acid and lithium battery specifications, CCA reference
  values by standard, battery groups and cross-reference tables.
theme:
  name: material
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

nav:
  - Home: index.md
  - CCA Reference:
      - Cold Cranking Amps: cca/index.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

repo_url: https://github.com/martinxionbiotech-max/worldbatteryhub.com
edit_uri: ""
